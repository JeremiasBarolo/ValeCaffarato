<app-breadcrumbs [titulo]= 'breadcrumbItems' class="mb-3"></app-breadcrumbs>
<div class="container mt-5">
    <div class="card mb-3 border border-0 mx-auto">
      <div class="card-body">
        <form [formGroup]="form">
          <div class="form-group">
            <label for="nombreTipo">Descripcion</label>
            <input type="text" class="form-control" id="descripcion" formControlName="descripcion">
            <div *ngIf="form.get('descripcion')?.invalid && form.get('descripcion')?.touched" class="text-danger">
              Este Campo es requerido
            </div>
          </div>
        <div class="row mt-5 text-center">
          <div class="col-xs-12 col-md-6 col-lg-6">
            <button [disabled]="form.invalid" type="button" class="btn btn-success" (click)="addCondicion()">Aceptar</button>
          </div>
          <div class="col-xs-12 col-md-6 col-lg-6">
              <button [routerLink]="['/dashboard/unidades-medida']" type="button" class="btn btn-info"> Volver </button>
          </div>
      </div>
      </form>
      </div>
  
      
    </div>
  </div>
