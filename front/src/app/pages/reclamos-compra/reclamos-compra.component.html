
<app-breadcrumbs [titulo]= 'breadcrumbItems' class="mb-3"></app-breadcrumbs>
<div class="text-right">
  <button type="button" class="btn btn-outline-success mr-2 " [routerLink]="['crear-editar']"> Agregar Reclamo</button>
</div>


<section style="margin: 16px">
    
  <input pInputText type="text" (input)="applyFilter($event)" placeholder="Buscar por nombre.." class="mb-3">
  <p-table #dt [value]="filteredReclamos" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]" [tableStyle]="{'max-width': '100vw'}">
    <ng-template pTemplate="header"  class="p-overlaypanel-header p-component-header">
        <tr class="table-header-color">
            <th pSortableColumn="id">
                ID
                <p-sortIcon field="id" style="margin: 16px"></p-sortIcon>
            </th>
            <th pSortableColumn="detalles_reclamos">
                Descripción
              <p-sortIcon field="detalles_reclamos" style="margin: 16px"></p-sortIcon>
          </th>
          <th pSortableColumn="TipoReclamo">
            Tipo Reclamo
          <p-sortIcon field="TipoReclamo" style="margin: 16px"></p-sortIcon>
          </th>
            <th pSortableColumn="Persona">
                Persona
                <p-sortIcon field="Persona" style="margin: 16px"></p-sortIcon>
            </th>

            <th pSortableColumn="pedidoFecha">
              Pedido
              <p-sortIcon field="pedidoFecha" style="margin: 16px"></p-sortIcon>
            </th>
           
            <th>
              Acciones
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData>
      <tr>
        <td  (click)="showCardDetails(rowData)">{{ rowData.id }}</td>
        <td  (click)="showCardDetails(rowData)">{{ rowData.detalles_reclamos }}</td>
        <td  (click)="showCardDetails(rowData)">{{ rowData.TipoReclamo }}</td>
        <td  (click)="showCardDetails(rowData)">{{ rowData.Persona }}</td>
        <td  (click)="showCardDetails(rowData)">{{rowData.pedidoFecha | date}} / #{{rowData.pedidoId}} </td>
        <td>
          <button routerLinkActive="router-link-active"
            type="button" class="btn btn-outline-primary" [routerLink]="['crear-editar', rowData.id]" aria-label="Editar Producto">
            <i class="fa-solid fa-pen-to-square"></i>
        </button>

              <button type="button" (click)="deleteEntidad(rowData.id)"
                  class="btn btn-outline-danger ms-4" aria-label="Borrar Producto"><i
                      class="fa-solid fa-trash"></i></button>
        </td>
        
      </tr>
    </ng-template>
  </p-table>
  
  

</section>
